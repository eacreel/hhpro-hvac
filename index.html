<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHpro</title>
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/products.css">
    <link rel="stylesheet" href="CSS/cart.css">
    <link rel="stylesheet" href="CSS/docs.css">
    <link rel="stylesheet" href="CSS/projects.css">
    <link rel="stylesheet" href="CSS/project_view.css">
</head>
<body>
    <div id="app-root"></div>

    <!-- Script load order matters:
         1. State and data modules
         2. Shared UI helpers
         3. Cart (needs State and Data to be loaded first)
         4. Docs (no dependencies)
         5. Individual views (login, main, projects, project_view, product base)
         6. Per-product extensions (filter visibility hooks etc.)
         7. App entry point last - wires it all together on DOMContentLoaded -->
    <script src="JS/state.js"></script>
    <script src="JS/data.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/cart.js"></script>
    <script src="JS/docs.js"></script>
    <script src="JS/login.js"></script>
    <script src="JS/main.js"></script>
    <script src="JS/projects.js"></script>
    <script src="JS/jszip.min.js"></script>
    <script src="JS/export.js"></script>
    <script src="JS/project_view.js"></script>
    <script src="JS/base.js"></script>
    <script src="JS/gas_packs.js"></script>
    <script src="JS/marvair.js"></script>
    <script src="JS/mini_splits.js"></script>
    <script src="JS/multi_position_splits.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
