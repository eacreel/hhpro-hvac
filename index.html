    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <!-- The ?v= query string cache-busts every stylesheet + script below.
         Bump it (any new value, e.g. the date) whenever deploying changes,
         so browsers can never mix a stale cached module with a fresh one. -->
    <link rel="stylesheet" href="CSS/base.css?v=20260813d">
    <link rel="stylesheet" href="CSS/login.css?v=20260813d">
    <link rel="stylesheet" href="CSS/main.css?v=20260813d">

    <link rel="stylesheet" href="CSS/quick_lookup.css?v=20260813d">
</head>
<body>
    <div id="app-root"></div>

    <!-- Script load order matters:
         1. State and data modules
         2. Shared UI helpers
         3. Cart (needs State and Data to be loaded first)
         4. Docs (no dependencies)
         5. Individual views (login, main, projects, project_view, product base)
         6. Per-product extensions (filter visibility hooks etc.)
         7. App entry point last - wires it all together on DOMContentLoaded -->
    <script src="JS/state.js?v=20260813d"></script>
    <script src="JS/data.js?v=20260813d"></script>
    <script src="JS/capacity.js?v=20260813d"></script>

    <script src="JS/main.js?v=20260813d"></script>
    <script src="JS/projects.js?v=20260813d"></script>
    <script src="JS/jszip.min.js?v=20260813d"></script>

    <script src="JS/app.js?v=20260813d"></script>
</body>
